services:
  # ── Backend: Express + WebSocket Security Gateway ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: warden-ai-backend
    ports:
      - "3001:3001"
    volumes:
      - warden-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Frontend: React Security Dashboard (via Nginx) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: warden-ai-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  warden-data:
    driver: local
